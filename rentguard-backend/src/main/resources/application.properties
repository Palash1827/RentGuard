spring.application.name=rentguard-backend

# ---- MongoDB (Spring Boot 4 uses spring.mongodb.*) ----
# Local:  mongodb://localhost:27017/rentguard
# Atlas:  mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/rentguard?retryWrites=true&w=majority
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rentguard}
spring.data.mongodb.auto-index-creation=true

# ---- JWT ----
# Secret MUST be 32+ characters. Override with the JWT_SECRET environment variable in production.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-chars-min}
app.jwt.expiration-minutes=1440

# ---- CORS (comma separated) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# ---- Uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
